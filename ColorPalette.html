<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Color Palette Generator </h1>
        <button id="generate-btn">
            <i class="fas fa-sync-alt"></i>Generate Palette
        </button>

        <div class="palette-container">
         <!--COLOR BOX 1-->
         <div class="color-box">
            <div class="color" style="background-color: #0B2D72;" </div>
            <div class="color-info">
                <span class="hex-value">#F2EFE7</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

         <!--COLOR BOX 2-->
         <div class="color-box">
            <div class="color" style="background-color: #0992C2;" </div>
            <div class="color-info">
                <span class="hex-value">#F2EFE7</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <!--COLOR BOX 3-->
        <div class="color-box">
            <div class="color" style="background-color: #0AC4E0;" </div>
            <div class="color-info">
                <span class="hex-value">#F2EFE7</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div>

        <!--COLOR BOX 4-->
        <div class="color-box">
            <div class="color" style="background-color: #F6E7BC;" </div>
            <div class="color-info">
                <span class="hex-value">#F2EFE7</span>
                <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
        </div> 

    </div>

    <script src="script.js"></script>
</body>

</html>
